name: Validate retail data
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild analysis from original CSVs
        run: python scripts/build_analysis.py
      - name: Run regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check committed analytical output
        run: git diff --exit-code -- analysis data/clean data/rejected checks/source_manifest.json checks/validation_results.json
